<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="ajuda.css">
    <link rel="icon" type="image/png" href="/logofinalizada.webp">
    <title>Entre em contato conosco!</title>
</head>
<body>
    <header>
        <div class="menu">
            <h1><img src="/logofinalizada.webp" width="100"><a href="perfil.html" class="link-animado">Olá,
                    @Usúario</a></h1>

            <button class="hamburger" id="hamburger" aria-label="Abrir menu" aria-expanded="false"
                aria-controls="nav-principal">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav id="nav-principal">
                <ul>
                    <li><a href="Inicio.html" class="link-animado">Início</a></li>
                    <li><a href="ajuda.html" class="link-animado">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="titulo-contato">
            <h2>Fale conosco</h2>
            <p>Dúvidas, sugestões ou precisa de ajuda? Envie sua mensagem!</p>
        </div>

        <form class="contato" id="formContato">

            <label for="nome">Digite seu nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name" required>

            <label for="email">Digite seu e-mail:</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>

            <label for="mensagem">Digite sua mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui sua mensagem..." required></textarea>

            <button type="submit">Enviar</button>

        </form>
    </main>
    <footer>
        <div class="rodape">
            <img src="/logo estendida1.webp" width="400">
            <nav>
                <ul>
                    <li><a href="perfil.html" class="link-animado">Perfil</a></li>
                    <li><a href="Inicio.html" class="link-animado">Inicio</a></li>
                    <li><a href="ajuda.html" class="link-animado">Contato</a></li>
                    <li><a href="" class="link-animado">Política de Privacidade</a></li>
                    <li><a href="" class="link-animado">Termos de Uso</a></li>
                </ul>
            </nav>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
