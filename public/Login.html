<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="reset.css">
    <title>Login e Cadastro</title>
</head>

<body>
        <div class="login">
            <div class="nome">
                <h1>BRÁULIO</h1>
                <p>Educação & Conhecimento</p>
            </div>

            <form action="/public/Inicio.html">
                <div class="form-grupo">
                    <label for="email">E-mail ou Utilizador</label>
                    <input type="text" id="email" name="email" placeholder="Digite o seu e-mail" required>
                </div>

                <div class="form-grupo">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-opcoes">
                    <label>
                        <input type="checkbox" name="remember"> Lembrar-me
                    </label>
                    <a href="#">Esqueceu a Senha?</a>
                </div>

                <button type="submit" class="bottao">Entrar</button>
            </form>

        </div>
</body>
</html>
